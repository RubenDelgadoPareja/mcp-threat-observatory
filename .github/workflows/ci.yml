name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: CLI smoke test
        run: node dist/cli.js checks

  end-to-end:
    name: demo endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Collect against the local demo server
        run: |
          node examples/demo-server.mjs &
          SERVER_PID=$!
          sleep 2
          node dist/cli.js scan http://127.0.0.1:8787/mcp --authorized --quiet --out /tmp/snapshots
          node dist/cli.js report "$(ls /tmp/snapshots/*/*.json | head -n 1)" --format stix > /tmp/bundle.json
          node -e 'const b=require("/tmp/bundle.json"); if(b.type!=="bundle"||!b.objects.length) process.exit(1)'
          kill $SERVER_PID

      - name: Cross-language check of the STIX export
        run: |
          PYTHONPATH=python/src python3 -m mcpobs_analysis validate-stix /tmp/bundle.json

      - name: Behavioural smoke test
        run: |
          ARGS=""
          if ! unshare -rn true 2>/dev/null; then ARGS="--allow-unisolated"; fi
          node dist/cli.js behaviour --authorized $ARGS --out /tmp/behaviour \
            -- node examples/behaviour/exfil-server.mjs > /tmp/behaviour-report.md
          grep -q "BEHAV-001" /tmp/behaviour-report.md
          node dist/cli.js behaviour --authorized $ARGS --out /tmp/behaviour-clean \
            -- node examples/behaviour/clean-server.mjs > /tmp/behaviour-clean.md
          if grep -q "BEHAV-00" /tmp/behaviour-clean.md; then
            echo "clean fixture produced behaviour findings"
            exit 1
          fi

      - name: Consent gate must fail closed
        run: |
          set +e
          node dist/cli.js scan https://example.com/mcp
          code=$?
          set -e
          test "$code" -eq 2

  python:
    name: python analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Standard library tests
        run: python -m unittest discover -s python/tests -t python -v

      - name: Reference implementation of STIX
        run: pip install "stix2>=3.0"

      - name: Deep-validate the committed bundle
        run: |
          PYTHONPATH=python/src python -m mcpobs_analysis validate-stix \
            examples/sample/bundle.stix.json --deep

      - name: Corpus analysis smoke test
        run: PYTHONPATH=python/src python -m mcpobs_analysis checks examples/corpus
